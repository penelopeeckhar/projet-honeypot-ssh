input {
  file {
    path => "/logs/honeypot/honeypot.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
  }
}

filter {
  # Parser le JSON des logs
  json {
    source => "message"
  }
  
  # CORRECTION: Renommer le champ "host" ajouté par Logstash pour éviter le conflit
  mutate {
    rename => { "host" => "logstash_host" }
  }
  
  # Ajouter des informations géographiques basées sur l'IP (optionnel)
  if [ip] {
    mutate {
      add_field => { "[@metadata][ip_address]" => "%{ip}" }
    }
  }
  
  # Convertir le timestamp
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
  
  # Ajouter un tag pour les alertes de brute-force
  if [event_type] == "brute_force_alert" {
    mutate {
      add_tag => [ "alert", "brute_force" ]
    }
  }
  
  # Ajouter un tag pour les commandes exécutées
  if [event_type] == "command_execution" {
    mutate {
      add_tag => [ "command" ]
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "honeypot-logs-%{+YYYY.MM.dd}"
  }
  
  # Debug output (optionnel)
  stdout {
    codec => rubydebug
  }
}
